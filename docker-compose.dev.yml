services:
  db:
    image: postgres:16@sha256:5a65324fe84dc41709ff914e90b07f3e2f577073ed27bf917d4873aca0c9ec51
    container_name: swingtradev3-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-swingtradev3}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - TZ=Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-swingtradev3}"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:16@sha256:5a65324fe84dc41709ff914e90b07f3e2f577073ed27bf917d4873aca0c9ec51
    profiles:
      - test
    environment:
      - POSTGRES_DB=swingtradev3_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - TZ=Asia/Kolkata
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swingtradev3_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    image: kepler-app:latest
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: swingtradev3-app
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./swingtradev3:/app
      - ./swingtradev3/context:/app/context
      - ./swingtradev3/logs:/app/logs
      - ./swingtradev3/strategy:/app/strategy
    env_file:
      - swingtradev3/.env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Kolkata
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/swingtradev3}
    depends_on:
      db:
        condition: service_healthy
      kite-mcp:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --max-time 5 -fsS -H \"X-API-Key: $$FASTAPI_API_KEY\" http://localhost:8000/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Native model/data libraries can prevent Uvicorn reload children from exiting cleanly.
    # Keep the source mount and restart this service after backend edits.
    command: >
      sh -c "
        exec uvicorn api.main:app --host 0.0.0.0 --port 8000
      "

  worker:
    image: kepler-app:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./swingtradev3:/app
      - ./swingtradev3/context:/app/context
      - ./swingtradev3/logs:/app/logs
      - ./swingtradev3/strategy:/app/strategy
    env_file:
      - swingtradev3/.env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Kolkata
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/swingtradev3}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "
        python -m execution.worker
      "

  app-test:
    image: kepler-app:latest
    profiles:
      - test
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./swingtradev3:/app
      - ./swingtradev3/context/nifty200.json:/test-fixtures/nifty200.json:ro
      - ./swingtradev3/context/nifty50.json:/test-fixtures/nifty50.json:ro
    tmpfs:
      - /app/context
      - /app/logs
      - /app/reports
    env_file:
      - swingtradev3/.env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Kolkata
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db-test:5432/swingtradev3_test
      - MEMGRAPH_URI=bolt://memgraph-test:7687
      - TELEGRAM_BOT_TOKEN=
      - TELEGRAM_CHAT_ID=
      - RUN_LIVE_EVAL=false
      - LOCAL_LLM_ENABLED=false
      - TOOLBOX_ENABLED=false
      - LIVE_TRADING_ENABLED=false
      - NEW_ENTRIES_ENABLED=false
    depends_on:
      db-test:
        condition: service_healthy
      memgraph-test:
        condition: service_healthy
    command: >
      sh -c "
        mkdir -p /app/context/auth /app/context/daily /app/context/research &&
        cp /test-fixtures/nifty200.json /app/context/nifty200.json &&
        cp /test-fixtures/nifty50.json /app/context/nifty50.json &&
        exec sleep infinity
      "

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: swingtradev3-dashboard
    ports:
      - "8502:3000"
    env_file:
      - swingtradev3/.env
    environment:
      - FASTAPI_URL=http://app:8000
      - TZ=Asia/Kolkata
    volumes:
      - ./swingtradev3-dashboard:/app
      - dashboard_node_modules:/app/node_modules
    depends_on:
      - app
    restart: unless-stopped

  kite-mcp:
    build:
      context: .
      dockerfile: Dockerfile.kite-mcp
    container_name: swingtradev3-kite-mcp
    ports:
      - "8081:8080"
    env_file:
      - swingtradev3/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  memgraph:
    image: memgraph/memgraph-mage:24.04@sha256:23a7c9080ce311a477c47ddee43759560f0a0154bee344c8ade1f1c1963a0c4a
    container_name: swingtradev3-memgraph
    profiles:
      - memory
    ports:
      - "${MEMGRAPH_BOLT_PORT:-7687}:7687"
      - "${MEMGRAPH_MONITORING_PORT:-7444}:7444"
    volumes:
      - memgraph_data:/var/lib/memgraph
      - memgraph_logs:/var/log/memgraph
    command:
      - "--log-level=${MEMGRAPH_LOG_LEVEL:-INFO}"
      - "--memory-limit=${MEMGRAPH_MEMORY_LIMIT_MIB:-2048}"
      - "--storage-snapshot-interval-sec=${MEMGRAPH_SNAPSHOT_INTERVAL_SEC:-300}"
      - "--storage-snapshot-on-exit=true"
      - "--storage-wal-enabled=true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 0;' | mgconsole || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  memgraph-test:
    image: memgraph/memgraph-mage:24.04@sha256:23a7c9080ce311a477c47ddee43759560f0a0154bee344c8ade1f1c1963a0c4a
    profiles:
      - test
    command:
      - "--log-level=WARNING"
      - "--memory-limit=1024"
      - "--storage-wal-enabled=false"
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 0;' | mgconsole || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 20

  memgraph-lab:
    image: memgraph/lab@sha256:ec612229af0cc854665b4af8361985159b64e0f1946eeaf4bbbad9e9c7219a9e
    container_name: swingtradev3-memgraph-lab
    profiles:
      - memory
    ports:
      - "${MEMGRAPH_LAB_PORT:-3001}:3000"
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687
    depends_on:
      memgraph:
        condition: service_healthy
    restart: unless-stopped

  toolbox:
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox@sha256:ab23064931b36e38e25ef5377bdc21d124bd9bbc391dfdee996e92e5e970281c
    container_name: swingtradev3-toolbox
    profiles:
      - memory
    ports:
      - "${TOOLBOX_PORT:-5000}:5000"
    env_file:
      - swingtradev3/.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-swingtradev3}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - MEMGRAPH_URI=${MEMGRAPH_URI:-bolt://memgraph:7687}
      - MEMGRAPH_USER=${MEMGRAPH_USER:-memgraph}
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD:-memgraph}
      - MEMGRAPH_DATABASE=${MEMGRAPH_DATABASE:-memgraph}
      - TZ=Asia/Kolkata
    volumes:
      - ./swingtradev3/toolbox/tools.yaml:/config/tools.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      memgraph:
        condition: service_healthy
    command: ["--config", "/config/tools.yaml", "--address", "0.0.0.0", "--port", "5000", "--enable-api"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/toolbox", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  dashboard_node_modules:
  memgraph_data:
  memgraph_logs:
